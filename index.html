<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Clockmaker's Last Hour</title>
<meta name="description" content="A 45-minute murder mystery escape room your group plays together from their own phones or computers.">
<meta name="theme-color" content="#13100c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23c49a45'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23efe6cf'/%3E%3Cpath d='M32 32 L32 14 M32 32 L44 38' stroke='%231d1610' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Courier+Prime:wght@400;700&family=Caveat:wght@500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: one-screen night-time workshop. Sticky timer bar, an illustrated wall with tappable objects, and a detective's notebook column beside it on wide screens (below it on phones). Deliberately single-theme: a dark room lit by one lamp. */
:root{
  color-scheme: dark;
  --night:#13100c;
  --panel:#1d1915;
  --panel-2:#28221b;
  --line:#3b342b;
  --fg:#efe6d3;
  --muted:#a89d89;
  --brass:#cfa650;
  --brass-dk:#8e6e2e;
  --paper:#ece3cd;
  --paper-2:#d9cdb0;
  --ink:#2a2219;
  --ink-soft:#5f5242;
  --oxblood:#6e2c22;
  --seal:#c0473a;
  --ok:#9dbd86;
  --pencil:#3a4a6a;
  --f-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-serif:"IM Fell English",Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1060px){
  .app.has-notes{grid-template-columns:minmax(0,1fr) 370px}
  .app.has-notes .hud{grid-column:1/-1}
  .notes{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 90px);overflow:auto}
  .notes-btn{display:none}
}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px 12px;background:var(--night);border-bottom:1px solid var(--line)}
.hud .t{display:flex;flex-direction:column;line-height:1.05}
.tl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.timer{font-family:var(--f-type);font-weight:700;font-size:1.85rem;font-variant-numeric:tabular-nums;color:var(--brass)}
.timer.low{color:var(--seal);animation:pulse 1s ease-in-out infinite}
.timer.paused{color:var(--muted)}
.gclock{font-family:var(--f-type);font-size:1rem;font-variant-numeric:tabular-nums;padding-top:6px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:.92rem;cursor:pointer}
.chip-btn:hover{border-color:var(--brass-dk)}
@media (max-width:440px){.chip-btn{padding:6px 11px;font-size:.86rem}.timer{font-size:1.6rem}}
@keyframes pulse{50%{opacity:.55}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--brass-dk)}
.btn.primary{background:var(--brass);color:#1b140a;border-color:var(--brass);font-weight:700}
.btn.primary:hover{background:#dcb764}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-type);letter-spacing:.14em;text-transform:uppercase;font-size:.74rem;color:var(--brass);margin:0}

/* Stage */
.stage{min-width:0;padding-top:4px}
.wallbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wallbar h2{font-family:var(--f-display);font-weight:400;font-size:1.65rem;margin:0;line-height:1}
.wallbar .pos{font-family:var(--f-type);color:var(--muted);font-size:.74rem;letter-spacing:.08em}
.navbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0}
.navbtn svg{width:18px;height:18px}
.navbtn:hover{border-color:var(--brass-dk)}
.wall-tabs{margin-left:auto;display:flex;gap:4px}
.wall-tabs button{border:1px solid transparent;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
.wall-tabs button[aria-current="true"]{color:var(--fg);border-color:var(--line);background:var(--panel)}
@media (max-width:720px){.wall-tabs{display:none}}
.scene{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#1d2a25;box-shadow:0 24px 50px -24px rgba(0,0,0,.9)}
.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;transition:filter .15s}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 6px rgba(240,200,110,.9)) brightness(1.15);outline:none}
.objs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.obj{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.95rem}
.obj:hover{border-color:var(--brass-dk)}
.obj .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none}
.obj.seen .dot{background:transparent;border:1px solid var(--muted)}
.obj .st{font-family:var(--f-type);font-size:.72rem;color:var(--ok);letter-spacing:.06em;text-transform:uppercase}
.tip{color:var(--muted);font-size:.88rem;margin:10px 0 0}
.swing{animation:swing 1.6s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.snow{animation:snow 7s linear infinite}
@keyframes snow{from{transform:translateY(0)}to{transform:translateY(60px)}}
.sechand{transform-origin:150px 150px;animation:sec 60s steps(60) infinite}
@keyframes sec{to{transform:rotate(360deg)}}

/* Notebook */
.notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 18px;min-width:0}
.notes h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0 0 6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 7px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:.88rem}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--brass)}
.case{font-size:.92rem;color:var(--muted);margin:0 0 6px}
.suspect{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px dashed var(--line)}
.mono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);background:var(--panel-2);border:1px solid var(--brass-dk);color:var(--brass);font-size:.95rem}
.suspect h4{margin:0;font-size:1rem;font-weight:700;line-height:1.2}
.suspect .role{font-size:.82rem;color:var(--muted)}
.quote{font-family:var(--f-serif);font-style:italic;font-size:.98rem;margin:6px 0 0;line-height:1.4}
.snotes{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.snotes li{font-size:.86rem;padding-left:12px;border-left:2px solid var(--brass-dk);line-height:1.35}
.evlist{display:grid;gap:10px}
.evcard{background:var(--paper);color:var(--ink);border-radius:3px;padding:10px 12px 11px;box-shadow:0 6px 14px -8px #000}
.evcard .tag{font-family:var(--f-type);font-size:.7rem;letter-spacing:.12em;color:#9c3a2e;text-transform:uppercase}
.evcard h4{margin:2px 0 3px;font-family:var(--f-serif);font-weight:400;font-size:1.08rem}
.evcard p{margin:0;font-size:.88rem;line-height:1.4;color:var(--ink-soft)}
.tline{list-style:none;padding:0;margin:0}
.tline li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding-block:7px;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.35}
.tline time{font-family:var(--f-type);color:var(--brass);font-variant-numeric:tabular-nums;font-size:.86rem}
.tline .by{display:block;font-size:.72rem;color:var(--muted);font-family:var(--f-type);letter-spacing:.06em;text-transform:uppercase}
.tline li.door time{color:var(--fg)}
.empty{color:var(--muted);font-size:.92rem}
.items{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.item b{display:block}
.item span{font-size:.88rem;color:var(--muted)}

/* Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,5,3,.76);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;width:100%;max-width:680px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (min-width:720px){.ov{align-items:center;padding:24px}.sheet{border-radius:14px;border-bottom:1px solid var(--line);padding:22px 26px 28px}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:1.75rem;margin:2px 0 0;line-height:1.05}
.x{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:1.3rem;line-height:1}
.sheet-body > p{margin:0 0 12px;max-width:62ch}
.sheet-body .art{display:block;margin:6px auto 14px;max-width:100%}
.msg{min-height:1.5em;margin:10px 0 0;text-align:center;font-weight:500}
.msg.bad{color:var(--seal)}
.msg.good{color:var(--ok)}

/* Paper & documents */
.paper{background:var(--paper);color:var(--ink);padding:18px 20px;border-radius:2px;box-shadow:0 2px 0 var(--paper-2),0 14px 26px -12px rgba(0,0,0,.8);margin:4px 0 14px}
.hand{font-family:var(--f-hand);font-size:1.38rem;line-height:1.32}
.typed{font-family:var(--f-type);font-size:.95rem;line-height:1.5}
.lined{background-image:repeating-linear-gradient(transparent 0 33px,rgba(58,74,106,.2) 33px 34px);background-color:var(--paper)}
.journal p{margin:0 0 .8em}
.journal .date{display:block;font-weight:600;color:var(--oxblood);font-size:1.12rem}
.cipher{font-family:var(--f-hand);font-size:2.2rem;letter-spacing:.04em;text-align:center;margin:.2em 0;color:var(--pencil)}
.page-label{font-family:var(--f-type);font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:16px 0 4px}
.tape{font-family:var(--f-type);background:var(--paper);color:var(--ink);max-width:340px;margin:6px auto 14px;padding:14px 18px;font-size:.95rem;line-height:1.75;white-space:pre;overflow-x:auto;box-shadow:0 14px 26px -12px #000;border-left:6px dotted var(--paper-2);border-right:6px dotted var(--paper-2)}
.transcript{border-left:3px solid var(--brass-dk);padding:4px 0 4px 14px;margin:12px 0}
.transcript p{margin:0 0 .7em;font-family:var(--f-serif);font-size:1.06rem;line-height:1.5}
.transcript .who{font-family:var(--f-type);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}

/* Locks */
.lock{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}
.wheel{appearance:none;-webkit-appearance:none;width:52px;height:68px;border-radius:8px;border:2px solid var(--brass-dk);background:linear-gradient(180deg,#8a6a2a,#e8c87a 42%,#f0d48e 50%,#e8c87a 58%,#8a6a2a);color:#1d150a;font:700 30px/1 var(--f-type);text-align:center;text-align-last:center;cursor:pointer;padding:0}
.wheel option{background:var(--paper);color:var(--ink);font-size:18px}
@media (max-width:420px){.wheel{width:44px;height:60px;font-size:26px}}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.setrow{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.setrow label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-items:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* Phone dial */
.dial{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:14px auto 8px;border-radius:50%;background:radial-gradient(circle,#2b2825 0 62%,#171513 63% 100%);box-shadow:inset 0 0 0 6px #0c0b0a,0 14px 30px -12px #000}
.dial .h{position:absolute;width:17.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#e8e0cf;color:#1a1612;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);padding:0}
.dial .h b{font:700 1.2rem var(--f-type)}
.dial .h small{font:700 .54rem var(--f-body);letter-spacing:.06em;margin-top:2px}
.dial .h:active{transform:translate(-50%,-50%) scale(.9)}
.dial-center{position:absolute;inset:33%;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;text-align:center;font:700 .62rem/1.3 var(--f-type);letter-spacing:.12em}
.fstop{position:absolute;width:6%;height:16%;background:linear-gradient(90deg,#9c7832,#e6c578);border-radius:3px;left:84%;top:66%;transform:rotate(-30deg)}
.dialled{font-family:var(--f-type);font-size:1.5rem;letter-spacing:.3em;text-align:center;min-height:1.6em;color:var(--brass)}
.card{background:var(--paper);color:var(--ink);font-family:var(--f-type);font-size:.88rem;padding:10px 14px;border-radius:2px;max-width:420px;margin:0 auto 6px;text-align:center;line-height:1.5}

/* Cuckoo */
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.fig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;cursor:pointer}
.fig:hover{border-color:var(--brass-dk)}
.fig svg{width:46px;height:62px}
.seq{text-align:center;font-family:var(--f-type);color:var(--muted);margin:12px 0 0;min-height:1.5em}

/* Photo */
.photo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 10px}
.photo svg{width:100%;height:auto;display:block;box-shadow:0 14px 26px -12px #000}

/* Parlour */
.parlour{max-width:820px;padding-top:8px}
.parlour h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,2.8rem);margin:.1em 0 .2em;line-height:1}
.parlour .lede-s{font-family:var(--f-serif);font-size:1.12rem;max-width:62ch;margin:0 0 22px}
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
legend{font-family:var(--f-serif);font-size:1.3rem;margin-bottom:8px;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);height:100%}
.opt input:checked + span{border-color:var(--brass);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--brass)}
.opt input:focus-visible + span{outline:2px solid var(--brass);outline-offset:2px}

/* Intro & ending */
.screen{grid-column:1/-1;max-width:900px;margin:0 auto;padding-block:36px 40px;width:100%}
.intro-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
@media (min-width:780px){.intro-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.screen h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,7.5vw,4.6rem);line-height:.95;margin:.25em 0 .35em;text-wrap:balance}
.lede p{font-family:var(--f-serif);font-size:1.18rem;line-height:1.55;margin:0 0 .8em;max-width:60ch}
.iclock{width:100%;max-width:280px;margin:0 auto;display:block}
.goal{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px;margin:20px 0;font-size:1.08rem}
.goal b{color:var(--brass);font-weight:700}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:8px 0 22px}
.cast div{display:flex;gap:10px;align-items:center}
.cast b{display:block;font-size:.98rem;line-height:1.2}
.cast span{font-size:.84rem;color:var(--muted)}
.howto{margin:0 0 24px;padding-left:1.2em;display:grid;gap:6px;max-width:64ch}
h3.sub{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 22px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.stat span{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--f-type);font-size:1.45rem;color:var(--brass);font-variant-numeric:tabular-nums}
.solution{display:grid;gap:8px;padding-left:1.2em;margin:0 0 24px;max-width:66ch}
.confession{font-family:var(--f-serif);font-size:1.18rem;line-height:1.55;max-width:62ch}

/* Hints & menu */
.goalcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel-2)}
.goalcard h4{margin:0 0 6px;font-size:1rem}
.goalcard ol{margin:0 0 8px;padding-left:1.2em;display:grid;gap:4px}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:500;box-shadow:0 12px 28px -10px #000;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.team{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 6px;cursor:pointer;text-align:left;line-height:1.15;min-width:0}
.team:hover{border-color:var(--brass-dk)}
.avs{display:inline-flex;flex:none}
.av{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);object-fit:cover;background:var(--panel-2);display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--brass);flex:none}
.avs .av + .av{margin-left:-8px}
.tm b{display:block;font-family:var(--f-type);font-size:.76rem;letter-spacing:.1em;color:var(--brass);font-weight:700}
.tm small{display:block;font-size:.76rem;color:var(--muted)}
.here{color:var(--brass);font-size:.9rem;margin:10px 0 0}
.here:empty{display:none}
.wb{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--brass);color:#1b140a;font-size:.68rem;font-weight:700;line-height:16px;text-align:center;margin-left:6px;padding:0 4px;vertical-align:1px}
.wb:empty{display:none}
.games{display:grid;gap:10px;margin:8px 0 16px}
.game{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);flex-wrap:wrap}
.game .gi{flex:1;min-width:0}
.game .gi b{font-family:var(--f-type);letter-spacing:.1em;color:var(--brass)}
.game .gi span{display:block;font-size:.9rem;color:var(--muted)}
.game .av{width:32px;height:32px}
.lobby-h{font-family:var(--f-type);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
#lobby{display:grid;gap:12px;margin-bottom:6px}
#lobby p{margin:0}
.roster{display:grid;gap:10px;margin:6px 0 16px}
.roster > div{display:flex;align-items:center;gap:12px}
.roster .av{width:36px;height:36px;font-size:.9rem}
.roster b{display:block}
.roster span{font-size:.88rem;color:var(--muted)}
.btn.big{font-size:1.08rem;padding:13px 22px}


.lobby{display:grid;gap:12px;margin-bottom:8px}
.lobby p{margin:0}
.invite{background:var(--panel-2);border:1px solid var(--brass-dk);border-radius:10px;padding:12px 14px}
.invite b{font-family:var(--f-type);letter-spacing:.12em;color:var(--brass)}
.fl{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.tin{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:1rem;color:var(--fg)}
.tin:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass-dk)}
.code-in{width:7.5em;font-family:var(--f-type);font-weight:700;font-size:1.3rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:9px 8px}
.lobby-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lcard{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);display:grid;gap:10px;align-content:start}
.lcard h4{margin:0;font-family:var(--f-serif);font-weight:400;font-size:1.3rem}
.lcard p{color:var(--muted);font-size:.95rem}
.netline{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sdot.ok{background:var(--ok)}
.sdot.bad{background:var(--seal)}
.invitebox{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);margin-bottom:14px}
.invitebox p{margin:0}
.bigcode{font-family:var(--f-type);font-weight:700;font-size:2.6rem;letter-spacing:.3em;color:var(--brass);line-height:1}
.linkbox{max-width:100%;font-family:var(--f-type);font-size:.85rem}
.roster .off{opacity:.55}
.invited-first{margin:4px 0 26px}
@media (max-width:779px){.iclock-wrap{display:none}}

@media (prefers-reduced-motion:reduce){
  .swing,.snow,.sechand,.timer.low,.sheet{animation:none}
  .toast{transition:none}
}

function freshGame(){ return {game:null, t0:0, pz:{v:0,at:0,acc:0,u:null}, solved:{}, items:{}, ev:{}, seen:{}, hints:{}, wrongs:[], untimed:false, wn:null, gid:""}; }

/* ---------------- Timer ---------------- */
function penaltyOf(g){ let h=0; const hs=g.hints||{}; for(const k in hs) h += hs[k]|0; return h*60000 + (g.wrongs||[]).length*180000; }
function remOf(g, now){
  if(!g.t0) return TOTAL;
  const pz = g.pz || {at:0, acc:0};
  const end = pz.at>0 ? pz.at : now;
  return Math.max(0, TOTAL - (end - g.t0 - (pz.acc||0)) - penaltyOf(g));
}
function remaining(){ return S.untimed ? null : remOf(S, Date.now()); }
function paused(){ return !S.untimed && S.pz.at>0; }
function fmt(ms){ const s = Math.ceil(ms/1000); const m = Math.floor(s/60); return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function clock12(totalMin){ const h24 = Math.floor(totalMin/60)%24, m = totalMin%60; const h = h24%12===0?12:h24%12; return h+":"+String(m).padStart(2,"0")+" "+(h24<12?"AM":"PM"); }

function screen(){
  if(!S.game) return "intro";

  if(!S.untimed && S.t0 && remaining()<=0) return "lost";
  return S.phase==="accuse" ? "accuse" : "play";

function pauseClock(){
  if(paused() || S.untimed || !S.t0) return;
  const now = Date.now();
  S.pz = {v:Math.max(now, S.pz.v+1), at:now, acc:S.pz.acc, u:myId};
  tentative = false; welcome = false;
  commit(); syncPauseSheet(); updateTimerDOM();
}
function resumeClock(){
  if(!S.pz.at) { syncPauseSheet(); return; }
  const now = Date.now();
  S.pz = {v:Math.max(now, S.pz.v+1), at:0, acc:S.pz.acc + Math.max(0, now - S.pz.at), u:myId};
  tentative = false; welcome = false;
  commit(); syncPauseSheet(); updateTimerDOM();
}
function updateTimerDOM(){
  const tEl = $("#timer"), cEl = $("#gclock"), lEl = $("#tlabel");

  if(S.untimed){ tEl.textContent = "Overtime"; tEl.className = "timer paused"; if(lEl) lEl.textContent = "The train has gone"; }
  else {
    const rem = remaining();
    tEl.textContent = fmt(rem);
    tEl.className = "timer" + (paused() ? " paused" : rem < 5*60000 ? " low" : "");
    if(lEl) lEl.textContent = paused() ? "Paused" : "Last train in";

  if(cEl) cEl.textContent = gameTime();
}
function tick(){
  const sc = screen();
  if(sc!==lastScreen){ render(); return; }
  if(sc==="intro"){ updateLobbyTimes(); return; }
  if(sc!=="play" && sc!=="accuse") return;
  updateTimerDOM();
  if(!S.untimed && !paused()){
    const sec = Math.ceil(remaining()/1000);
    if(sec!==lastSec){ lastSec = sec; tickSound(sec); if(sec%2===0){ S.lastSeen = Date.now(); save(); } }
  }
}

  const news = [];
  if(!src || typeof src!=="object") return news;
  if(isNum(src.t0) && src.t0>0 && (!S.t0 || src.t0 < S.t0)){ S.t0 = src.t0; news.push({k:"sync"}); }
  const pz = src.pz;
  if(pz && typeof pz==="object" && isNum(pz.v) && pz.v > S.pz.v && isNum(pz.at) && isNum(pz.acc)){
    const was = S.pz.at>0;
    S.pz = {v:pz.v, at:Math.max(0,pz.at), acc:Math.max(0,pz.acc), u:idStr(pz.u)};
    const now = S.pz.at>0;
    news.push(was!==now ? {k:now?"paused":"resumed", u:S.pz.u||fromBy} : {k:"sync"});
  }
  if(src.sv && typeof src.sv==="object") for(const k of PUZZLES){
    if(src.sv[k] && !S.solved[k]){ S.solved[k] = idStr(src.sv[k]) || 1; news.push({k:"solve", p:k, u: typeof S.solved[k]==="string" ? S.solved[k] : fromBy}); }
  }
  if(src.it && typeof src.it==="object") for(const k of Object.keys(ITEMS)) if(src.it[k] && !S.items[k]){ S.items[k] = 1; news.push({k:"item"}); }
  if(src.ev && typeof src.ev==="object") for(const k of EV_ORDER){
    const v = src.ev[k];
    if(isNum(v) && (S.ev[k]==null || v < S.ev[k])){ const isNew = S.ev[k]==null; S.ev[k] = Math.max(0, Math.round(v)); news.push({k:isNew?"ev":"sync"}); }
  }
  if(src.sn && typeof src.sn==="object") for(const k of Object.keys(OBJ)) if(src.sn[k] && !S.seen[k]){ S.seen[k] = true; news.push({k:"sync"}); }
  if(src.h && typeof src.h==="object") for(const g of GOALS){
    const v = src.h[g.id];
    if(isNum(v)){ const nv = Math.min(g.hints.length, Math.max(0, Math.floor(v))); if(nv > (S.hints[g.id]||0)){ S.hints[g.id] = nv; news.push({k:"hint", u:fromBy}); } }
  }
  if(Array.isArray(src.w)) for(const x of src.w.slice(0,30)){
    if(typeof x==="string" && x.length<=24 && !S.wrongs.includes(x) && S.wrongs.length<30){ S.wrongs.push(x); news.push({k:"wrong", u:fromBy}); }
  }
  if(src.ut && !S.untimed){ S.untimed = true; news.push({k:"untimed"}); }
  const wn = src.wn;
  if(wn && typeof wn==="object" && isNum(wn.at) && (!S.wn || wn.at < S.wn.at)){
    const first = !S.wn;
    S.wn = {at:wn.at, r:isNum(wn.r) ? Math.max(0, wn.r) : null, u:idStr(wn.u)};
    if(first) news.push({k:"won", u:S.wn.u||fromBy});
  }
  return news;
}

/* ---------------- Playing together (free public relays) ----------------
   Each device keeps a copy of the shared game and posts it, with its player's
   name and where they are, to a small MQTT relay channel named after the game
   code. Everyone in the game merges what they hear: progress only ever grows
   (union of solved locks, keys, evidence, hints and wrong guesses), the earliest
   start time wins, and the newest pause/resume wins. The same update goes to
   several free public relays at once, so one being down doesn't stop the game.
   Messages are kept by the relay ("retained"), so a player who rejoins later
   still catches up. */
const RELAYS = (()=>{
  try{ const q = new URLSearchParams(location.search).get("relay"); if(q) return q.split(",").filter(u=>/^wss?:\/\//.test(u)); }catch(e){}
  return ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];
})();
const NS = "clockmakers-last-hour/v1/";
const PKEY = "clockmakers-last-hour-player";
const enc = new TextEncoder(), dec = new TextDecoder();

/* A tiny MQTT 3.1.1 client over WebSocket: connect, subscribe, publish (QoS 0), keep-alive, reconnect. */
function mqVarint(n){ const out=[]; do{ let b = n % 128; n = Math.floor(n/128); if(n>0) b |= 128; out.push(b); }while(n>0); return out; }
function mqStr(s){ const b = enc.encode(s); return [b.length>>8, b.length&255, ...b]; }
function mqPacket(first, body){ return new Uint8Array([first, ...mqVarint(body.length), ...body]); }
class Relay {
  constructor(url, onMessage, onState){
    this.url = url; this.onMessage = onMessage; this.onState = onState;
    this.subs = new Set(); this.connected = false; this.backoff = 1500; this.nextId = 1; this.buf = new Uint8Array(0);
    this.open();
  }
  open(){
    if(this.closed) return;
    let ws;
    try{ ws = new WebSocket(this.url, ["mqtt"]); }catch(e){ this.retry(); return; }
    ws.binaryType = "arraybuffer"; this.ws = ws; this.buf = new Uint8Array(0);
    const cid = "clh" + Math.random().toString(36).slice(2,12);
    ws.onopen = ()=>{ this.raw(mqPacket(0x10, [...mqStr("MQTT"), 4, 0x02, 0, 60, ...mqStr(cid)])); };
    ws.onmessage = ev=>{ if(ev.data instanceof ArrayBuffer) this.feed(new Uint8Array(ev.data)); };
    ws.onclose = ()=>{ const was = this.connected; this.connected = false; clearInterval(this.ping); if(was) this.onState(); this.retry(); };
    ws.onerror = ()=>{ try{ ws.close(); }catch(e){} };
  }
  retry(){ if(this.closed) return; clearTimeout(this.rt); this.rt = setTimeout(()=>this.open(), this.backoff); this.backoff = Math.min(this.backoff*2, 30000); }
  raw(bytes){ try{ if(this.ws && this.ws.readyState===1) this.ws.send(bytes); }catch(e){} }
  feed(chunk){
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); this.buf = b;
    for(;;){
      const buf = this.buf; if(buf.length < 2) return;
      let len = 0, mul = 1, i = 1, byte;
      do{ if(i >= buf.length) return; byte = buf[i++]; len += (byte & 127) * mul; mul *= 128; if(i > 5){ this.ws.close(); return; } }while(byte & 128);
      if(buf.length < i + len) return;
      this.handle(buf[0]>>4, buf[0]&15, buf.subarray(i, i+len));
      this.buf = buf.slice(i+len);
    }
  }
  handle(type, flags, body){
    if(type===2){ // CONNACK
      if(body[1]===0){
        this.connected = true; this.backoff = 1500;
        for(const t of this.subs) this.sendSub(t);
        clearInterval(this.ping); this.ping = setInterval(()=>this.raw(new Uint8Array([0xC0,0])), 25000);
        this.onState();
      } else { try{ this.ws.close(); }catch(e){} }
    } else if(type===3){ // PUBLISH
      const qos = (flags>>1)&3, retained = !!(flags&1);
      const tl = (body[0]<<8)|body[1];
      const topic = dec.decode(body.subarray(2, 2+tl));
      let i = 2+tl;
      if(qos>0){ const id = (body[i]<<8)|body[i+1]; i += 2; if(qos===1) this.raw(new Uint8Array([0x40,2,id>>8,id&255])); }
      try{ this.onMessage(topic, body.subarray(i), retained); }catch(e){ console.error(e); }
    }
  }
  pid(){ this.nextId = (this.nextId % 65000) + 1; return [this.nextId>>8, this.nextId&255]; }
  sendSub(t){ this.raw(mqPacket(0x82, [...this.pid(), ...mqStr(t), 0])); }
  subscribe(t){ this.subs.add(t); if(this.connected) this.sendSub(t); }
  unsubscribe(t){ if(!this.subs.delete(t)) return; if(this.connected) this.raw(mqPacket(0xA2, [...this.pid(), ...mqStr(t)])); }
  publish(topic, text, retain){
    if(!this.connected) return false;
    this.raw(mqPacket(0x30 | (retain?1:0), [...mqStr(topic), ...enc.encode(text)]));
    return true;
  }
}

function loadPlayer(){
  try{ const p = JSON.parse(localStorage.getItem(PKEY)||"null"); if(p && /^[a-z0-9]{6,16}$/.test(p.pid)) return {pid:p.pid, name:cleanName(p.name)}; }catch(e){}
  const p = {pid:(rid()+rid()).slice(0,12).replace(/[^a-z0-9]/g,"0"), name:""};
  try{ localStorage.setItem(PKEY, JSON.stringify(p)); }catch(e){}
  return p;
}
function savePlayer(){ try{ localStorage.setItem(PKEY, JSON.stringify(me)); }catch(e){} }
function cleanName(n){ return typeof n==="string" ? n.replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁦-⁩]/g,"").trim().slice(0,20) : ""; }
const me = loadPlayer();
const myId = me.pid;
const CONN = Math.random().toString(36).slice(2,10);
const bootAt = Date.now();
let relays = [], peersMap = {}, subTopic = null, pubTimer = null, pendingJoin = null, everConnected = false, teamTimer = null;

function relayOnline(){ return relays.some(r=>r.connected); }
function netStatus(){ return relayOnline() ? "online" : (Date.now() - bootAt < 8000 && !everConnected) ? "connecting" : "offline"; }
function wire(){ return {t0:S.t0, pz:S.pz, sv:S.solved, it:S.items, ev:S.ev, sn:S.seen, h:S.hints, w:S.wrongs, ut:S.untimed?1:0, wn:S.wn}; }
function payload(extra){
  return Object.assign({v:1, pid:myId, conn:CONN, n:me.name||"", gid:S.gid, ts:Date.now(), s:wire(), at:{w:S.wall, o:curView||"", p:S.phase==="accuse"?"parlour":"room"}}, extra||{});
}
function publishNow(extra){
  clearTimeout(pubTimer); pubTimer = null;
  if(!S.game || !S.gid) return;
  const text = JSON.stringify(payload(extra));
  relays.forEach(r=>r.publish(NS + S.game + "/" + myId, text, true));
}
function publish(force){
  if(!S.game) return;
  if(force){ publishNow(); return; }
  if(!pubTimer) pubTimer = setTimeout(publishNow, 250);
}
function subscribeGame(code){
  const t = code ? NS + code + "/+" : null;
  if(t===subTopic) return;
  if(subTopic) relays.forEach(r=>r.unsubscribe(subTopic));
  peersMap = {};
  subTopic = t;
  if(t) relays.forEach(r=>r.subscribe(t));
}
function onRelayMessage(topic, bytes, retained){
  if(!bytes.length || bytes.length > 16000) return;
  const parts = topic.split("/");
  if(parts.length!==4 || NS !== parts[0]+"/"+parts[1]+"/") return;
  const code = parts[2], pidT = parts[3];
  let m; try{ m = JSON.parse(dec.decode(bytes)); }catch(e){ return; }
  if(!m || typeof m!=="object" || m.v!==1 || m.pid!==pidT || !/^[a-z0-9]{6,16}$/.test(m.pid)) return;
  if(m.conn===CONN) return;
  const now = Date.now(), ts = isNum(m.ts) ? m.ts : 0;
  const heard = retained ? Math.min(now, ts) : now;
  const prev = peersMap[m.pid];
  peersMap[m.pid] = {pid:m.pid, n:cleanName(m.n), gid:typeof m.gid==="string" ? m.gid.slice(0,16) : "", code,
    at:(m.at && typeof m.at==="object") ? {w:m.at.w|0, o:typeof m.at.o==="string"?m.at.o:"", p:m.at.p==="parlour"?"parlour":"room"} : null,
    left:!!m.left, heard:Math.max(heard, prev && prev.ts===ts ? prev.heard : 0), ts};
  if(prev && prev.ts > ts){ peersMap[m.pid] = prev; }
  if(pendingJoin && code===pendingJoin.code){ pendingJoin.found[m.pid] = m; return; }
  if(S.game===code && S.gid && m.gid===S.gid){
    const news = merge(m.s, m.pid).map(n=>Object.assign(n, {self:m.pid===myId}));
    if(news.length){ save(); afterMerge(news); publish(); }
  }
  if(!teamTimer) teamTimer = setTimeout(()=>{ teamTimer = null; renderTeam(); }, 120);
}
function teammates(){
  if(!S.game) return [];
  const now = Date.now();
  return Object.values(peersMap).filter(p=>p.code===S.game && p.gid===S.gid && p.pid!==myId && !p.left && now - p.heard < 40000);
}
function knownTeam(){ return Object.values(peersMap).filter(p=>p.code===S.game && p.gid===S.gid && p.pid!==myId); }
function onRelayState(){
  if(relayOnline()){
    if(!everConnected){ everConnected = true; setTimeout(welcomeBackCheck, 3000); }
    publish(true);
  }
  renderTeam(); renderLobby();
}
function connectNet(){
  relays = RELAYS.map(u=>new Relay(u, onRelayMessage, onRelayState));
  if(S.game) subscribeGame(S.game);
  setInterval(()=>{ if(S.game && relayOnline()) publishNow(); renderTeam(); }, 12000);
  setTimeout(()=>{ if(!everConnected) welcomeBackCheck(); renderTeam(); renderLobby(); }, 8000);
}
function nameOf(id){
  if(!id) return "A teammate";
  if(id===myId) return "You";
  const p = peersMap[id];
  return (p && p.n) || "A teammate";
}
const PRI = {won:6, solve:5, wrong:4, hint:3, paused:2, resumed:2, untimed:2};
function teamToasts(news){
  const ext = news.filter(n=>!n.self && PRI[n.k]);
  if(!ext.length){
    const evn = news.filter(n=>!n.self && n.k==="ev").length;
    if(evn && (screen()==="play"||screen()==="accuse")) toast(evn===1 ? "Your team found new evidence. It's in the notebook." : `Your team found ${evn} new pieces of evidence.`);
    return;
  }
  ext.sort((a,b)=>PRI[b.k]-PRI[a.k]);
  const n = ext[0];
  const who = nameOf(n.u);
  if(who==="You") return;
  const msg = {
    won: `${who} named the killer.`,
    solve: `${who} ${SOLVE_NEWS[n.p]||"solved a puzzle"}.`,
    wrong: `${who} made a wrong accusation.${S.untimed?"":" (−3:00)"}`,
    hint: `${who} used a hint.${S.untimed?"":" (−1:00)"}`,
    paused: `${who} paused the clock.`,
    resumed: `${who} restarted the clock.`,
    untimed: "Your team kept investigating after midnight.",
  }[n.k];
  if(msg) toast(msg);
}
function afterMerge(news){
  if(tentative && savedPz && S.pz.v > savedPz.v){ tentative = false; welcome = false; }
  const sc = screen();
  if(sc!==lastScreen){ render(); }
  else if(sc==="play" || sc==="accuse"){
    if(news.some(n=>n.k==="solve" || n.k==="item")){ if(sc==="play") renderStage(); refreshView(); }
    else if(sc==="play") renderObjs();
    renderNotes(); updateTimerDOM();
  }
  syncPauseSheet();
  teamToasts(news);
}
function welcomeBackCheck(){
  if(!tentative) return;
  if(teammates().length){
    if(savedPz && S.pz.v===savedPz.v) S.pz = savedPz;
    tentative = false; welcome = false;
    save(); syncPauseSheet(); updateTimerDOM();
    toast("You're back with your team.");
    return;
  }
  S.pz = {v:Math.max(Date.now(), S.pz.v+1), at:S.pz.at, acc:S.pz.acc, u:myId};
  tentative = false;
  commit();
}

function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } if(actx && actx.state==="suspended"){ actx.resume().catch(()=>{}); } }
function tone(freq,dur,type,vol,when){
  if(!S.sound || !actx) return;
  try{
    const t = actx.currentTime + (when||0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||.06, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}

function f1(n){ return Math.round(n*10)/10; }
function pt(cx,cy,r,deg){ const a = deg*Math.PI/180; return [cx + r*Math.sin(a), cy - r*Math.cos(a)]; }
function face(o){
  const cx=o.cx, cy=o.cy, r=o.r, ink=o.ink||"#2a2219";

  if(o.inner) o.inner.forEach((L,i)=>{ const [x,y]=pt(cx,cy,r*(o.ir||.48),(i+1)*30); s += `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="central" font-family="${MONO}" font-size="${f1(r*(o.is||.1))}" fill="#7a6a55">${L}</text>`; });
  (o.text||[]).forEach(t=>{ s += `<text x="${cx}" y="${f1(cy+r*t.dy)}" text-anchor="middle" dominant-baseline="central" font-family="${t.font||SERIF}" font-size="${f1(r*t.s)}" fill="${t.fill||ink}" letter-spacing="${t.ls||0}">${t.t}</text>`; });

    s += `<circle cx="${cx}" cy="${cy}" r="${f1(Math.max(1.2,r*.06))}" fill="${o.cap||"#8e6e2e"}"/>`;

}

function escapementSVG(){
  const cx=110, cy=140, R=58; let pts = [];
  for(let i=0;i<15;i++){ const a=i*24; pts.push(pt(cx,cy,R*.8,a), pt(cx,cy,R,a+6), pt(cx,cy,R*.8,a+12)); }
  const poly = pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ");
  return `<svg class="art" viewBox="0 0 300 220" width="300" aria-label="Pencil sketch of an escapement"><g stroke="#3a4a6a" stroke-width="1.6" fill="none" stroke-linecap="round">
    <polygon points="${poly}"/><circle cx="${cx}" cy="${cy}" r="10"/><path d="M${cx} ${cy-10} V ${cy-R*.8}"/>
    <path d="M110 30 L64 66 M110 30 L156 66 M64 66 l-6 22 M156 66 l6 22 M110 30 v-14"/><circle cx="110" cy="30" r="5"/>
    <path d="M196 70 q20 -8 40 0" /><path d="M180 140 h40"/></g>
    <text x="240" y="66" font-family="Caveat, cursive" font-size="17" fill="#3a4a6a">pallets (×2)</text><text x="226" y="146" font-family="Caveat, cursive" font-size="17" fill="#3a4a6a">escape wheel</text></svg>`;
}
function mossTranscript(){

    <p>One call from the house tonight: the hall telephone to St. Luke's Hospital. Connected at 10:31, cleared at 10:52. Dr. Amesbury was speaking.</p>

const DIAL_LETTERS = {1:"",2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PRS",8:"TUV",9:"WXY",0:"OPER"};
function dialHTML(){
  const order = [1,2,3,4,5,6,7,8,9,0];
  const holes = order.map((d,k)=>{ const a=(60-k*30)*Math.PI/180; const left=50+37*Math.sin(a), top=50-37*Math.cos(a);
    return `<button class="h" data-act="dial" data-d="${d}" style="left:${f1(left)}%;top:${f1(top)}%" aria-label="Dial ${d}${DIAL_LETTERS[d]?" ("+DIAL_LETTERS[d].split("").join(" ")+")":""}"><b>${d}</b><small>${DIAL_LETTERS[d]}</small></button>`; }).join("");
  return `<div class="dial">${holes}<div class="dial-center">ASHBY<br>EXCHANGE</div><div class="fstop"></div></div>`;
}

/* ---------------- Rendering ---------------- */
function render(){
  const app = $("#app"); const sc = screen(); lastScreen = sc;
  if(sc!=="play" && sc!=="accuse"){ hideSheet(); const t = $("#toast"); if(t) t.classList.remove("on"); }
  if(sc==="intro"){ app.className = "app"; app.innerHTML = introHTML(); renderLobby(); return; }
  if(sc==="won" || sc==="lost"){ app.className = "app"; app.innerHTML = endHTML(); fillEndNames(); return; }
  app.className = "app has-notes";
  app.innerHTML = hudHTML() + `<main class="stage" id="stage"></main><aside class="notes" id="notes" aria-label="Notebook"></aside>`;
  renderStage(); renderNotes(); renderTeam(); updateTimerDOM(); syncPauseSheet();
}
function hudHTML(){
  return `<header class="hud"><div class="t"><span class="tl" id="tlabel">Last train in</span><span class="timer" id="timer">45:00</span></div>
    <div class="t"><span class="tl">Ashby time</span><span class="gclock" id="gclock">11:15 PM</span></div>
    <button class="team" id="team" data-act="team" aria-label="Your team"></button>
    <div class="acts"><button class="chip-btn" data-act="hint">Hint</button><button class="chip-btn notes-btn" data-act="notes">Notes</button>${S.untimed?"":`<button class="chip-btn" data-act="pause">Pause</button>`}<button class="chip-btn" data-act="menu">Menu</button></div></header>`;
}
const CHEV_L = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_R = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function renderStage(){
  const st = $("#stage"); if(!st) return;
  if(S.phase==="accuse"){ st.innerHTML = accuseHTML(); return; }
  const w = WALLS[S.wall];
  st.innerHTML = `<div class="wallbar"><button class="navbtn" data-act="prev" aria-label="Turn to the previous wall">${CHEV_L}</button>
    <div><h2>${w.name}</h2><span class="pos">WALL ${S.wall+1} OF 4</span></div>
    <button class="navbtn" data-act="next" aria-label="Turn to the next wall">${CHEV_R}</button>
    <nav class="wall-tabs" aria-label="Walls">${WALLS.map((x,i)=>`<button data-act="wall" data-w="${i}" aria-current="${i===S.wall}">${x.name}<span class="wb" data-wb="${i}"></span></button>`).join("")}</nav></div>
    <div class="scene">${SCENES[S.wall]()}</div><div class="objs" id="objs"></div>
    <p class="here" id="here" aria-live="polite"></p>
    <p class="tip">Tap anything in the room to examine it.${doorOpen()?" The door is open. Go through it when you're ready to accuse.":""}</p>`;
  renderObjs(); renderTeam();
}
function objStatus(id){
  const map = {journal:"journal", cabinet:"cabinet", register:"register", phone:"phone", cuckoo:"cuckoo", grandfather:"grandfather"};
  if(id==="door" && doorOpen()) return "open";
  if(map[id] && S.solved[map[id]]) return "solved";
  return "";
}
function renderObjs(){
  const el = $("#objs"); if(!el) return;
  el.innerHTML = WALLS[S.wall].objs.map(id=>{ const st = objStatus(id);
    return `<button class="obj${S.seen[id]?" seen":""}" data-hot="${id}"><span class="dot" aria-hidden="true"></span>${OBJ[id]}${st?`<span class="st">${st}</span>`:""}</button>`; }).join("");
}
function avatarHTML(pid, label){
  const h = [...String(pid||"x")].reduce((a,c)=>((a*31 + c.charCodeAt(0))>>>0), 7) % 360;
  return `<span class="av" style="background:hsl(${h} 32% 28%);color:hsl(${h} 70% 84%)" aria-hidden="true">${esc(((label||"?").trim()[0]||"?").toUpperCase())}</span>`;
}
function peerName(p){ return (p && p.n) || "Detective"; }
function peerAvatar(p){ return null; }
function article(label){ return /^(Edmund's|Apprentice's)/.test(label) ? label : "the " + label.charAt(0).toLowerCase() + label.slice(1); }
function whereText(at){
  if(!at || typeof at!=="object") return "Looking around";
  if(at.p==="parlour") return "In the parlour, ready to accuse";
  if(typeof at.o==="string" && OBJ[at.o]) return "Looking at " + article(OBJ[at.o]);
  const w = WALLS[at.w]; return w ? "At the " + w.name.toLowerCase() : "Looking around";
}
function renderTeam(){
  const el = $("#team"), here = $("#here");
  const mates = teammates();
  if(el){
    const avs = [avatarHTML(myId, me.name||"You")].concat(mates.slice(0,3).map(p=>avatarHTML(p.pid, peerName(p))));
    const st = netStatus();
    const sub = st==="connecting" ? "Connecting…" : st==="offline" ? "Offline · this device only" : mates.length ? `${mates.length+1} detectives` : "Just you so far";
    el.innerHTML = `<span class="avs">${avs.join("")}</span><span class="tm"><b>GAME ${esc(S.game||"")}</b><small>${sub}</small></span>`;
  }
  if(here){
    const there = mates.filter(p=>p.at && p.at.p!=="parlour" && p.at.w===S.wall);
    here.textContent = there.length ? "Also at this wall: " + there.map(p=>peerName(p)).join(", ") : "";
  }
  document.querySelectorAll("[data-wb]").forEach(b=>{
    const i = +b.dataset.wb; const n = mates.filter(p=>p.at && p.at.p!=="parlour" && p.at.w===i).length;
    b.textContent = n ? String(n) : "";
  });
}
function renderNotes(){
  const el = $("#notes"); if(!el) return;
  const tab = S.nbTab, evs = evList();
  const nItems = Object.keys(S.items).filter(k=>S.items[k] && ITEMS[k]).length;
  const tabs = [["suspects","Suspects"],["evidence",`Evidence (${evs.length})`],["timeline","Timeline"],["items",`Items (${nItems})`]];
  let body = "";
  if(tab==="suspects"){
    body = `<p class="case">Edmund Harrow, 60, clockmaker. Found dead at his bench at 10:55 PM. No marks on him. Statements taken at 11:05 PM:</p>` +
      SUSPECTS.map(s=>{ const notes = SUSPECT_NOTES[s.id].filter(n=>S.ev[n[0]]!=null);
        return `<div class="suspect"><div class="mono" aria-hidden="true">${s.ini}</div><div><h4>${s.name}</h4><div class="role">${s.role}</div><p class="quote">“${s.said}”</p>${notes.length?`<ul class="snotes">${notes.map(n=>`<li>${n[1]}</li>`).join("")}</ul>`:""}</div></div>`; }).join("");
  } else if(tab==="evidence"){
    body = evs.length ? `<div class="evlist">${evs.map((id,i)=>`<div class="evcard"><div class="tag">Exhibit ${String.fromCharCode(65+i)}</div><h4>${EV[id].title}</h4><p>${EV[id].text}</p></div>`).join("")}</div>`
      : `<p class="empty">Nothing yet. Examine things in the workshop and the evidence will collect here for the whole team.</p>`;
  } else if(tab==="timeline"){
    const rows = TL.filter(r=>r[2]===null || S.ev[r[2]]!=null).sort((a,b)=>a[0]-b[0]);
    body = `<ul class="tline">${rows.map(r=>`<li class="${r[2]==="tape"?"door":""}"><time>${r[1]}</time><div>${r[3]}<span class="by">${r[4]}</span></div></li>`).join("")}</ul>${S.ev.tape!=null?"":`<p class="empty" style="margin-top:10px">More times will appear as you find evidence.</p>`}`;
  } else {
    body = nItems ? `<div class="items">${Object.keys(ITEMS).filter(k=>S.items[k]).map(k=>`<div class="item"><div><b>${ITEMS[k].title}</b><span>${ITEMS[k].text}</span></div></div>`).join("")}</div><p class="empty" style="margin-top:10px">Keys are shared: anyone on the team can use them.</p>`
      : `<p class="empty">The team's pockets are empty.</p>`;
  }
  el.innerHTML = `<h3>Notebook</h3><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join("")}</div><div role="tabpanel">${body}</div>`;
}
function radios(name, opts){
  return `<div class="opts">${opts.map(([v,l])=>`<label class="opt"><input type="radio" name="${name}" value="${v}"${accVals[name]===v?" checked":""}><span>${l}</span></label>`).join("")}</div>`;
}
function accuseHTML(){
  return `<section class="parlour"><p class="eyebrow">The parlour · 4 suspects</p><h2>Name the killer</h2>
    <p class="lede-s">Constable Pike has just come in from the snow, stamping his boots. Margaret, Dr. Amesbury, Victor Lang and Clara Doyle look up as you walk in. Everyone is waiting.</p>
    <form id="accuse" novalidate>
      <fieldset><legend>Who killed Edmund Harrow?</legend>${radios("who", SUSPECTS.map(s=>[s.id,s.name]))}</fieldset>
      <fieldset><legend>How?</legend>${radios("how", HOW)}</fieldset>
      <fieldset><legend>Why?</legend>${radios("why", WHY)}</fieldset>

function hideSheet(){

/* ---------------- Game actions ---------------- */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 3000); }
function addEvidence(id){

function giveItem(id){ S.items[id] = 1; commit(); renderNotes(); }
function setMsg(text, cls){ const m = $("#msg"); if(m){ m.textContent = text; m.className = "msg " + (cls||""); } }
function shake(sel){ const el = $(sel); if(!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function solve(p){
  if(S.solved[p]) { refreshView(); return; }
  S.solved[p] = myId || 1;
  if(p==="journal"){ addEvidence("journal"); toast("The lock springs open. Edmund's journal is in the notebook."); }
  if(p==="cabinet"){ addEvidence("cabinet"); giveItem("registerKey"); toast("Cabinet open. You took the register key."); }
  if(p==="register"){ addEvidence("tape"); }
  if(p==="phone"){ addEvidence("call"); }
  if(p==="cuckoo"){ giveItem("photo"); addEvidence("photo"); }

  if(p==="door"){ toast("The door is open."); }

}
function tryLock(p){
  const pre = p==="journal" ? "j" : "c";
  const val = lockVals[pre].join("");
  const ans = p==="journal" ? "1896" : "PALLET";
  if(val===ans) solve(p);
  else { wrongSound(); shake("#lock-"+pre); setMsg(p==="journal"?"The lock doesn't give.":"The wheels click, but the door stays shut.", "bad"); }
}
function dial(d){
  if(lineBusy) return;
  dialBuf += d;
  const out = $("#dialled"); if(out) out.textContent = dialBuf;
  const line = $("#line");
  if(dialBuf==="0"){
    lineBusy = true;
    if(line) line.innerHTML = `<div class="transcript"><div class="who">Operator</div><p>“Number, please? … Call records? Not at this hour, dear. You'll want the night supervisor. Dial her direct.” <i>Click.</i></p></div>`;
    setTimeout(()=>{ dialBuf=""; lineBusy=false; const o=$("#dialled"); if(o) o.innerHTML="&nbsp;"; }, 900);
    return;
  }
  if(dialBuf.length===4){
    lineBusy = true;
    if(dialBuf==="6677"){ setTimeout(()=>{ dialBuf=""; lineBusy=false; solve("phone"); const l=$("#line"); if(l) l.scrollIntoView({behavior:"smooth",block:"nearest"}); }, 500); }
    else {
      wrongSound();
      if(line) line.innerHTML = `<div class="transcript"><div class="who">The line</div><p>A dry click, then a tinny voice: “There is no such number on the Ashby exchange.”</p></div>`;
      setTimeout(()=>{ dialBuf=""; lineBusy=false; const o=$("#dialled"); if(o) o.innerHTML="&nbsp;"; }, 900);
    }
  }
}
function pull(fig){
  if(S.solved.cuckoo || cuckooSeq.length>=3) return;
  cuckooSeq.push(fig);
  const q = $("#seq"); if(q) q.textContent = cuckooSeq.map(f=>FIG[f]).join(" → ");
  tone(520 + cuckooSeq.length*90, .12, "triangle", .05);
  if(cuckooSeq.length===3){
    if(cuckooSeq.join()==="baker,woodcutter,lamplighter"){
      setMsg("The weights drop, the gears whir, and the little door bangs open…", "good");
      setTimeout(()=>{ cuckooSeq=[]; solve("cuckoo"); }, 900);
    } else {
      wrongSound(); setMsg("The chains slide back up. Nothing happens.", "bad");
      setTimeout(()=>{ cuckooSeq=[]; const s=$("#seq"); if(s) s.textContent="No chains pulled yet."; }, 1100);
    }
  }
}
function setGF(){
  if(gfVals.h===4 && gfVals.m===15) solve("grandfather");
  else { wrongSound(); shake("#gfdial"); setMsg("She ticks on. Nothing happens.", "bad"); }
}
function accuse(){
  const f = $("#accuse"); const m = $("#amsg");
  const who = f.elements.who.value, how = f.elements.how.value, why = f.elements.why.value;
  if(!who || !how || !why){ m.textContent = "Choose an answer for all three questions."; return; }
  if(who==="clara" && how==="cyanide" && why==="patent"){ win(); return; }
  if(S.wrongs.length<30) S.wrongs.push(rid());
  commit(); wrongSound(); updateTimerDOM();
  const lines = ["Constable Pike frowns. “That doesn't fit the evidence. Look again.”","Someone in the room breathes out. Constable Pike shakes his head. “No. Not like that.”","“I can't arrest anyone on that,” says Constable Pike."];
  m.textContent = lines[(S.wrongs.length-1)%lines.length] + (S.untimed?"":" (−3:00)");
}
function win(){
  S.wn = {at:Date.now(), r:S.untimed ? null : remaining(), u:myId};
  commit(); render(); window.scrollTo(0,0); unlockSound();
}
function setWall(i){ S.wall = (i+4)%4; save(); renderStage(); publish(); }
function readName(){ const i = $("#pname"); if(i){ me.name = cleanName(i.value); savePlayer(); } }
function newGame(){
  readName();
  const snd = S.sound; S = defaultState(); S.sound = snd; resetLocals();
  S.game = newCode(); S.gid = rid(); S.t0 = Date.now(); S.lastSeen = Date.now();
  subscribeGame(S.game); clearHash();
  commit(); render(); window.scrollTo(0,0);

}
function lobbyMsg(t, c){ const m = $("#lmsg"); if(m){ m.textContent = t; m.className = "msg " + (c||""); } }
function joinGame(){
  readName();
  const inp = $("#jcode");
  const code = (inp ? inp.value : "").toUpperCase().replace(/[^A-Z]/g, "");
  if(code.length!==4){ lobbyMsg("Game codes are 4 letters.", "bad"); return; }
  if(!relayOnline()){ lobbyMsg("Can't reach the game servers right now. Check your internet connection and try again.", "bad"); return; }
  if(pendingJoin) return;
  pendingJoin = {code, found:{}};
  subscribeGame(code);
  lobbyMsg(`Looking for game ${code}…`);
  setTimeout(finishJoin, 2500);
}
function finishJoin(){
  const pj = pendingJoin; pendingJoin = null; if(!pj) return;
  const msgs = Object.values(pj.found).filter(m=>typeof m.gid==="string" && m.gid);
  if(!msgs.length){ subscribeGame(null); lobbyMsg(`No game found with code ${pj.code}. Check the code with whoever started it.`, "bad"); return; }
  msgs.sort((a,b)=>(isNum(b.ts)?b.ts:0)-(isNum(a.ts)?a.ts:0));
  const gid = msgs[0].gid.slice(0,16);
  const snd = S.sound; S = defaultState(); S.sound = snd; resetLocals();
  S.game = pj.code; S.gid = gid;
  for(const m of msgs) if(m.gid===gid) merge(m.s, m.pid);
  if(!S.t0) S.t0 = Date.now();
  S.lastSeen = Date.now(); clearHash();
  commit(); render(); window.scrollTo(0,0);
  toast(`You joined game ${pj.code}.`);
}
function leaveGame(){
  if(S.game && relayOnline()) publishNow({left:1});
  subscribeGame(null);
  const snd = S.sound; S = defaultState(); S.sound = snd; resetLocals();
  commit(); render(); window.scrollTo(0,0);
}
function act(a, el){
  switch(a){
    case "new": newGame(); break;
    case "join": joinGame(); break;
    case "share": try{ navigator.share({title:"The Clockmaker's Last Hour", text:`Join my murder mystery escape room. Game code: ${S.game}`, url:inviteLink()}).catch(()=>{}); }catch(e){} break;
    case "copy": { const ok=()=>{ const m=$("#cmsg"); if(m){ m.textContent="Invite link copied."; m.className="msg good"; } }; const no=()=>{ const i=$("#invlink"); if(i){ i.focus(); i.select(); } const m=$("#cmsg"); if(m){ m.textContent="Select the link above and copy it."; m.className="msg"; } }; try{ navigator.clipboard.writeText(inviteLink()).then(ok, no); }catch(e){ no(); } break; }
    case "prev": setWall(S.wall-1); break;
    case "next": setWall(S.wall+1); break;
    case "wall": setWall(+el.dataset.w); break;
    case "tab": S.nbTab = el.dataset.tab; save(); renderNotes(); break;
    case "notes": { const n=$("#notes"); if(n) n.scrollIntoView({behavior:"smooth", block:"start"}); break; }
    case "team": openTeam(); break;
    case "hint": openHints(); break;
    case "reveal": { const id = el.dataset.g; const g = GOALS.find(x=>x.id===id); if(!g) break; const n = S.hints[id]||0; if(n>=g.hints.length) break; S.hints[id] = n+1; commit(); updateTimerDOM(); openHints(); break; }
    case "pause": pauseClock(); break;
    case "resume": resumeClock(); break;
    case "menu": openMenu(false); break;
    case "howto": openHowTo(); break;
    case "sound": S.sound = !S.sound; if(S.sound) ensureAudio(); save(); openMenu(false); break;
    case "leave-ask": openMenu(true); break;
    case "leave-no": openMenu(false); break;
    case "leave": leaveGame(); break;
    case "close": closeSheet(); break;
    case "try": tryLock(el.dataset.p); break;
    case "use": if(el.dataset.p==="register" && S.items.registerKey) solve("register"); if(el.dataset.p==="door" && S.items.doorKey) solve("door"); break;
    case "dial": dial(el.dataset.d); break;
    case "hangup": dialBuf=""; lineBusy=false; { const o=$("#dialled"); if(o) o.innerHTML="&nbsp;"; const l=$("#line"); if(l) l.innerHTML = S.solved.phone?mossTranscript():""; } break;
    case "pull": pull(el.dataset.fig); break;
    case "set-gf": setGF(); break;
    case "parlour": hideSheet(); S.phase="accuse"; save(); renderStage(); publish(); window.scrollTo(0,0); break;
    case "back-room": S.phase="play"; save(); renderStage(); publish(); break;
    case "untimed": S.untimed = true; commit(); render(); break;
    case "reveal-solution": S.showSolution = true; save(); render(); break;
  }
}

/* ---------------- Events ---------------- */
document.addEventListener("click", e=>{
  const ov = $("#ov");
  if(e.target===ov){ closeSheet(); return; }
  const h = e.target.closest("[data-hot]");
  if(h){ openView(h.dataset.hot); return; }
  const a = e.target.closest("[data-act]");
  if(a) act(a.dataset.act, a);
});
document.addEventListener("keydown", e=>{
  if((e.key==="Enter" || e.key===" ") && e.target.matches && e.target.matches("g[data-hot]")){ e.preventDefault(); openView(e.target.dataset.hot); return; }
  if(e.key==="Escape" && !$("#ov").hidden){ closeSheet(); return; }
  if(e.key==="Enter" && e.target.id==="jcode"){ e.preventDefault(); joinGame(); return; }
  if(e.key==="Enter" && e.target.id==="pname"){ e.preventDefault(); const j=$("#jcode"); if(j && j.value) joinGame(); return; }
  if($("#ov").hidden && screen()==="play" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key==="ArrowLeft") setWall(S.wall-1);
    if(e.key==="ArrowRight") setWall(S.wall+1);
  }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.matches(".wheel[data-pre]")){ lockVals[t.dataset.pre][+t.dataset.i] = t.value; tone(900,.03,"square",.03); }
  if(t.id==="gh" || t.id==="gm"){ gfVals[t.id==="gh"?"h":"m"] = +t.value; const d=$("#gfdial"); if(d) d.innerHTML = gfDial(); }
  if(t.name==="who" || t.name==="how" || t.name==="why"){ accVals[t.name] = t.value; }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="pname"){ me.name = cleanName(t.value); savePlayer(); }
  if(t.id==="jcode"){ const v = t.value.toUpperCase().replace(/[^A-Z]/g,""); if(v!==t.value) t.value = v; }
});
document.addEventListener("submit", e=>{ if(e.target.id==="accuse"){ e.preventDefault(); accuse(); } });
document.addEventListener("pointerdown", ()=>{ if(S.sound) ensureAudio(); }, {passive:true});
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ if(S.game && !paused()) S.lastSeen = Date.now(); save(); } });

/* ---------------- Boot ---------------- */
let booted = false;
function start(){
  if(booted) return; booted = true;
  const l = load();
  if(l){
    S = l;
    if(S.game && !S.gid) S = Object.assign(defaultState(), {sound:S.sound});
    // Coming back after a long gap: hold the clock where it was until we know whether teammates kept playing.
    if(S.game && S.t0 && !S.wn && !S.untimed && !(S.pz.at>0) && S.lastSeen && Date.now() - S.lastSeen > 15000 && remOf(S, S.lastSeen) > 0){
      savedPz = Object.assign({}, S.pz);
      S.pz = {v:S.pz.v, at:S.lastSeen, acc:S.pz.acc, u:null};
      tentative = true; welcome = true;
    }
  }
  render();
  setInterval(tick, 250);
  connectNet();
}
start();
})();
</script>
</body>
</html>
